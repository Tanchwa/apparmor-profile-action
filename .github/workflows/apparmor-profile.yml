name: AppArmor profile

# Reusable workflow. Application repos call this to regenerate their AppArmor
# profile, open a pull request with it, and let GitHub merge that PR once the
# required reviews and checks are satisfied. The profile is committed into the
# calling repo so it versions alongside the application it confines.
#
# Two structural decisions worth knowing:
#
#  1. `target` switches between the _docker and _host
#     sub-actions. The switch lives here rather than in a root composite
#     action because a relative `uses: ./...` inside a composite action
#     resolves against $GITHUB_WORKSPACE, not the action's own directory
#     (actions/runner#2101), so a root action could not reach its siblings.
#
#  2. No input is ever executed as a shell command. Each sub-action bakes in
#     its own docker/apt/binary invocations and callers supply only structured
#     values, which become argv elements. There is no `run:` or
#     `setup_command:` escape hatch, by design.

on:
  workflow_call:
    inputs:
      # --- what to confine -------------------------------------------------
      name:
        description: Profile name, e.g. "myapp" or "usr.bin.myapp".
        required: true
        type: string
      target:
        description: docker | host.
        type: string
        default: docker
      profile_path:
        description: Where the profile lives in the calling repo. Defaults to apparmor.d/<name>.
        type: string
        default: ''

      # --- docker target ---------------------------------------------------
      docker_image:
        description: Image to confine. Built from the repo when docker_build is true, otherwise pulled.
        type: string
        default: ''
      docker_build:
        description: Build the image before learning.
        type: boolean
        default: false
      docker_build_context:
        description: Docker build context directory.
        type: string
        default: '.'
      docker_dockerfile:
        description: Dockerfile path.
        type: string
        default: Dockerfile
      docker_build_args:
        description: Newline-separated KEY=VALUE build arguments.
        type: string
        default: ''
      docker_build_target:
        description: Dockerfile stage to build.
        type: string
        default: ''
      docker_entrypoint:
        description: Override the image entrypoint. A single executable, not a shell line.
        type: string
        default: ''
      docker_args:
        description: Newline-separated arguments passed to the container, one per line.
        type: string
        default: ''
      docker_env:
        description: Newline-separated KEY=VALUE environment variables.
        type: string
        default: ''
      docker_ports:
        description: Newline-separated HOST:CONTAINER port mappings.
        type: string
        default: ''
      docker_volumes:
        description: Newline-separated SOURCE:TARGET[:ro] mounts.
        type: string
        default: ''
      docker_user:
        description: Value for docker run --user.
        type: string
        default: ''
      docker_workdir:
        description: Value for docker run --workdir.
        type: string
        default: ''
      docker_network:
        description: Value for docker run --network.
        type: string
        default: ''
      docker_stop_timeout:
        description: Seconds to allow a detached container to stop.
        type: number
        default: 10

      # --- host target ------------------------------------------------------
      host_binary:
        description: Absolute path to the executable. Also the profile's attachment path.
        type: string
        default: ''
      host_args:
        description: Newline-separated arguments passed to the binary, one per line.
        type: string
        default: ''
      host_env:
        description: Newline-separated KEY=VALUE environment variables.
        type: string
        default: ''
      host_workdir:
        description: Directory to run the binary from.
        type: string
        default: ''
      host_run_as:
        description: Run the binary as this user via sudo -u.
        type: string
        default: ''
      host_apt_packages:
        description: Newline-separated apt packages to install before learning.
        type: string
        default: ''
      host_deb_package:
        description: Path to a .deb built by the repository, installed before learning.
        type: string
        default: ''
      host_stop_signal:
        description: Signal used to stop a detached binary.
        type: string
        default: TERM
      host_stop_timeout:
        description: Seconds to wait after the stop signal before sending KILL.
        type: number
        default: 10

      # --- exercising the workload (both targets) ---------------------------
      detach:
        description: Start the workload in the background and exercise it over HTTP.
        type: boolean
        default: false
      ready_url:
        description: Poll this http(s) URL until it answers before probing.
        type: string
        default: ''
      ready_timeout:
        description: Seconds to wait for ready_url.
        type: number
        default: 60
      probe_urls:
        description: >-
          Newline-separated probes run while the workload runs. Each line is
          "URL" (GET, expect 2xx), "METHOD URL", or "METHOD STATUS URL" where
          STATUS is any / a class like 4xx / an exact code. An endpoint that is
          meant to reject the request still runs its handler, so
          "POST 401 http://localhost:5000/webhook" is a legitimate probe.
        type: string
        default: ''
      probe_timeout:
        description: Per-request timeout in seconds.
        type: number
        default: 10
      ready_expect_status:
        description: >-
          Status that counts as ready: "any" (the server answered at all), a
          class such as 2xx, or an exact code. Default "any", because readiness
          asks whether the process is listening -- a service whose only route is
          an authenticated POST answers 405 to a GET and is nonetheless up.
        type: string
        default: any
      probe_headers:
        description: >-
          Newline-separated "Name: value" headers sent with every probe. Never
          echoed to the log.
        type: string
        default: ''
      probe_body:
        description: Request body sent with every non-GET probe. Never echoed to the log.
        type: string
        default: ''
      dwell_seconds:
        description: >-
          Seconds to let the workload keep running after probing. With no probes
          at all this is how a startup-only profile is learned.
        type: number
        default: 0
      run_timeout:
        description: Seconds to allow a non-detached workload to run.
        type: number
        default: 300
      allow_workload_failure:
        description: Generate a profile even if the workload or probes fail.
        type: boolean
        default: false

      # --- profile shaping ---------------------------------------------------
      generator:
        description: auto | runtime | spec.
        type: string
        default: auto
      spec_file:
        description: Declarative spec used when the runtime generator is not available.
        type: string
        default: apparmor.spec.yaml
      mode:
        description: enforce | complain.
        type: string
        default: enforce
      abi:
        description: AppArmor ABI to pin, e.g. "3.0". Empty omits the abi rule.
        type: string
        default: ''
      flags:
        description: Comma-separated profile flags.
        type: string
        default: attach_disconnected,mediate_deleted
      abstractions:
        description: Comma-separated abstractions to include.
        type: string
        default: base
      exec_mode:
        description: Transition mode for learned executables (ix, Px, Ux, Cx).
        type: string
        default: ix
      glob_threshold:
        description: Collapse N+ sibling files sharing a permission set into <dir>/*. 0 disables.
        type: number
        default: 0
      generalize:
        description: Replace per-run path components (pids, tids) with globs.
        type: boolean
        default: true
      exclude:
        description: Newline-separated regexes of learned paths to drop.
        type: string
        default: ''
      rewrite:
        description: Newline-separated REGEX=REPLACEMENT path rewrites.
        type: string
        default: ''
      extra_rules:
        description: Newline-separated rules appended verbatim to the profile.
        type: string
        default: ''
      settle_seconds:
        description: Seconds to wait after the workload before harvesting audit records.
        type: number
        default: 3
      load_check:
        description: Load the generated profile into the kernel as an extra validation step.
        type: boolean
        default: false

      # --- pull request ------------------------------------------------------
      ref:
        description: >-
          Ref to generate from. Defaults to the base branch when opening a PR,
          and to the ref that triggered the caller when dry_run is set, so a
          pull_request drift check compares against the PR's own contents.
        type: string
        default: ''
      branch:
        description: Head branch for the PR. Defaults to apparmor/<name>.
        type: string
        default: ''
      base:
        description: Base branch to target. Defaults to the repository default branch.
        type: string
        default: ''
      commit_message:
        description: "Commit subject. Defaults to \"chore(apparmor): update <name> profile\"."
        type: string
        default: ''
      pr_title:
        description: PR title. Defaults to the commit subject.
        type: string
        default: ''
      pr_body:
        description: Extra markdown appended to the generated PR body.
        type: string
        default: ''
      labels:
        description: Comma-separated labels to apply to the PR.
        type: string
        default: apparmor,security
      reviewers:
        description: Comma-separated usernames to request review from.
        type: string
        default: ''
      team_reviewers:
        description: Comma-separated team slugs to request review from.
        type: string
        default: ''
      draft:
        description: Open the PR as a draft. Auto-merge cannot be enabled on drafts.
        type: boolean
        default: false

      # --- merge behaviour ----------------------------------------------------
      auto_merge:
        description: Ask GitHub to merge the PR once reviews and checks pass.
        type: boolean
        default: true
      merge_method:
        description: squash | merge | rebase.
        type: string
        default: squash
      require_auto_merge:
        description: Fail the workflow if auto-merge cannot be enabled.
        type: boolean
        default: false

      # --- modes ---------------------------------------------------------------
      dry_run:
        description: Generate and validate only. Never pushes or opens a PR.
        type: boolean
        default: false
      fail_on_drift:
        description: Fail when the committed profile differs from the generated one. Pairs with dry_run for a PR check.
        type: boolean
        default: false

      # --- plumbing -------------------------------------------------------------
      runs_on:
        description: Runner label. Runtime learning needs an AppArmor-enabled Linux runner.
        type: string
        default: ubuntu-latest
      action_repo:
        description: Repository holding this workflow and its sub-actions.
        type: string
        default: Tanchwa/apparmor-profile-action
      action_ref:
        description: >-
          Ref of action_repo holding the sub-actions and scripts. PIN THIS TO
          THE SAME TAG YOU CALL THIS WORKFLOW WITH: calling @v1 while this
          still says "main" runs v1's workflow against main's generator. The
          runner's GITHUB_JOB_WORKFLOW_SHA, where available, overrides this
          with the exact commit the workflow was resolved to.
        type: string
        default: main
      timeout_minutes:
        description: Job timeout.
        type: number
        default: 30

    secrets:
      token:
        description: >-
          Token used to push and open the PR. Strongly recommended: a PAT or
          GitHub App token, because pull requests opened with the default
          GITHUB_TOKEN do not trigger workflows, so required status checks
          never run and auto-merge never fires. Falls back to GITHUB_TOKEN.
        required: false

    outputs:
      changed:
        description: "true when the generated profile differs from what is committed."
        value: ${{ jobs.generate.outputs.changed }}
      profile_path:
        description: Path of the profile in the calling repo.
        value: ${{ jobs.generate.outputs.profile_path }}
      generator_used:
        description: Which generator ran, runtime or spec.
        value: ${{ jobs.generate.outputs.generator_used }}
      pr_number:
        description: Number of the opened or updated PR (empty if none).
        value: ${{ jobs.propose.outputs.pr_number }}
      pr_url:
        description: URL of the opened or updated PR (empty if none).
        value: ${{ jobs.propose.outputs.pr_url }}

# No workflow-level `permissions` on purpose. `generate` pins itself to
# contents:read, which is always a valid downgrade of whatever the caller
# granted. `propose` deliberately declares nothing and inherits the caller's
# grant instead: a called job that requests more than the caller holds is
# rejected outright, which would break every caller that runs this read-only
# as a drift check. The caller decides, and the README says what to grant.

jobs:
  generate:
    name: Generate the profile
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      profile_path: ${{ steps.vars.outputs.profile_path }}
      generator_used: ${{ steps.docker.outputs.generator_used || steps.host.outputs.generator_used }}
      branch: ${{ steps.vars.outputs.branch }}
      base: ${{ steps.vars.outputs.base }}
      subject: ${{ steps.vars.outputs.subject }}
      title: ${{ steps.vars.outputs.title }}
      artifact: ${{ steps.vars.outputs.artifact }}

    steps:
      - name: Resolve defaults
        id: vars
        env:
          # Deliberately github.token, never secrets.token. Even though this
          # job no longer executes caller-supplied shell, a write-scoped PAT
          # has no business in the job that builds and runs the application.
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ACTION_REF: ${{ inputs.action_ref }}
          NAME: ${{ inputs.name }}
          TARGET: ${{ inputs.target }}
          DOCKER_IMAGE: ${{ inputs.docker_image }}
          HOST_BINARY: ${{ inputs.host_binary }}
          PROFILE_PATH: ${{ inputs.profile_path }}
          REF: ${{ inputs.ref }}
          BRANCH: ${{ inputs.branch }}
          BASE: ${{ inputs.base }}
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
          PR_TITLE: ${{ inputs.pr_title }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DRY_RUN: ${{ inputs.dry_run }}
          GENERATOR: ${{ inputs.generator }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          case "$NAME" in
            ''|*[!A-Za-z0-9_.-]*)
              echo "::error::name must be non-empty and contain only [A-Za-z0-9_.-], got '$NAME'"
              exit 1 ;;
          esac

          case "$TARGET" in
            docker|host) ;;
            *) echo "::error::target must be 'docker' or 'host', got '$TARGET'"; exit 1 ;;
          esac

          # Catch a missing target-specific input here rather than ten minutes
          # into a build.
          if [ "$GENERATOR" != "spec" ]; then
            if [ "$TARGET" = "docker" ] && [ -z "$DOCKER_IMAGE" ]; then
              echo "::error::target 'docker' needs docker_image (unless generator is 'spec')"
              exit 1
            fi
            if [ "$TARGET" = "host" ] && [ -z "$HOST_BINARY" ]; then
              echo "::error::target 'host' needs host_binary"
              exit 1
            fi
          fi

          profile_path="${PROFILE_PATH:-apparmor.d/$NAME}"
          case "$profile_path" in
            /*|*..*)
              echo "::error::profile_path must be a relative path inside the repository, got '$profile_path'"
              exit 1 ;;
          esac

          # github.event.repository is absent on a few event types.
          base="${BASE:-$DEFAULT_BRANCH}"
          if [ -z "$base" ]; then
            base="$(gh repo view "$REPOSITORY" --json defaultBranchRef --jq .defaultBranchRef.name)"
          fi

          # When only checking for drift we want the ref that triggered the
          # caller (a PR's merge commit, say), which is checkout's own default.
          # When opening a PR we branch from the base instead.
          if [ -n "$REF" ]; then
            checkout_ref="$REF"
          elif [ "$DRY_RUN" = "true" ]; then
            checkout_ref=""
          else
            checkout_ref="$base"
          fi

          subject="${COMMIT_MESSAGE:-chore(apparmor): update $NAME profile}"

          # A caller pinning @v1 while action_ref still says "main" would run
          # v1's workflow logic against main's generator scripts. The runner
          # exposes the commit this reusable workflow was resolved to as
          # GITHUB_JOB_WORKFLOW_SHA on versions that support it; prefer it, and
          # make the choice visible either way so skew is never silent.
          if [ -n "${GITHUB_JOB_WORKFLOW_SHA:-}" ]; then
            action_ref="$GITHUB_JOB_WORKFLOW_SHA"
            echo "Generator revision: $action_ref (pinned to this workflow's own commit)"
          else
            action_ref="$ACTION_REF"
            echo "::notice::Generator revision: $action_ref (from action_ref). Pin this to the same tag you call this workflow with."
          fi

          {
            echo "profile_path=$profile_path"
            echo "checkout_ref=$checkout_ref"
            echo "branch=${BRANCH:-apparmor/$NAME}"
            echo "base=$base"
            echo "subject=$subject"
            echo "title=${PR_TITLE:-$subject}"
            echo "action_ref=$action_ref"
            echo "artifact=apparmor-profile-$NAME-$RUN_ID"
          } >> "$GITHUB_OUTPUT"

      - name: Check out the application repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.vars.outputs.checkout_ref }}
          persist-credentials: false

      - name: Check out the profile generator
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.action_repo }}
          ref: ${{ steps.vars.outputs.action_ref }}
          path: .apparmor-profile-action
          persist-credentials: false

      - name: Keep the generator out of the application diff
        run: echo "/.apparmor-profile-action/" >> .git/info/exclude

      # --- the switch -------------------------------------------------------
      - name: Generate the profile (docker)
        id: docker
        if: inputs.target == 'docker'
        uses: ./.apparmor-profile-action/_docker
        with:
          name: ${{ inputs.name }}
          output: ${{ steps.vars.outputs.profile_path }}
          generator: ${{ inputs.generator }}
          image: ${{ inputs.docker_image }}
          build: ${{ inputs.docker_build }}
          build_context: ${{ inputs.docker_build_context }}
          dockerfile: ${{ inputs.docker_dockerfile }}
          build_args: ${{ inputs.docker_build_args }}
          build_target: ${{ inputs.docker_build_target }}
          entrypoint: ${{ inputs.docker_entrypoint }}
          args: ${{ inputs.docker_args }}
          env: ${{ inputs.docker_env }}
          ports: ${{ inputs.docker_ports }}
          volumes: ${{ inputs.docker_volumes }}
          container_user: ${{ inputs.docker_user }}
          workdir: ${{ inputs.docker_workdir }}
          network: ${{ inputs.docker_network }}
          stop_timeout: ${{ inputs.docker_stop_timeout }}
          detach: ${{ inputs.detach }}
          ready_url: ${{ inputs.ready_url }}
          ready_timeout: ${{ inputs.ready_timeout }}
          probe_urls: ${{ inputs.probe_urls }}
          probe_timeout: ${{ inputs.probe_timeout }}
          ready_expect_status: ${{ inputs.ready_expect_status }}
          probe_headers: ${{ inputs.probe_headers }}
          probe_body: ${{ inputs.probe_body }}
          dwell_seconds: ${{ inputs.dwell_seconds }}
          run_timeout: ${{ inputs.run_timeout }}
          allow_workload_failure: ${{ inputs.allow_workload_failure }}
          spec_file: ${{ inputs.spec_file }}
          mode: ${{ inputs.mode }}
          abi: ${{ inputs.abi }}
          flags: ${{ inputs.flags }}
          abstractions: ${{ inputs.abstractions }}
          exec_mode: ${{ inputs.exec_mode }}
          glob_threshold: ${{ inputs.glob_threshold }}
          generalize: ${{ inputs.generalize }}
          exclude: ${{ inputs.exclude }}
          rewrite: ${{ inputs.rewrite }}
          extra_rules: ${{ inputs.extra_rules }}
          settle_seconds: ${{ inputs.settle_seconds }}
          load_check: ${{ inputs.load_check }}

      - name: Generate the profile (host binary)
        id: host
        if: inputs.target == 'host'
        uses: ./.apparmor-profile-action/_host
        with:
          name: ${{ inputs.name }}
          output: ${{ steps.vars.outputs.profile_path }}
          generator: ${{ inputs.generator }}
          binary: ${{ inputs.host_binary }}
          args: ${{ inputs.host_args }}
          env: ${{ inputs.host_env }}
          workdir: ${{ inputs.host_workdir }}
          run_as: ${{ inputs.host_run_as }}
          apt_packages: ${{ inputs.host_apt_packages }}
          deb_package: ${{ inputs.host_deb_package }}
          stop_signal: ${{ inputs.host_stop_signal }}
          stop_timeout: ${{ inputs.host_stop_timeout }}
          detach: ${{ inputs.detach }}
          ready_url: ${{ inputs.ready_url }}
          ready_timeout: ${{ inputs.ready_timeout }}
          probe_urls: ${{ inputs.probe_urls }}
          probe_timeout: ${{ inputs.probe_timeout }}
          ready_expect_status: ${{ inputs.ready_expect_status }}
          probe_headers: ${{ inputs.probe_headers }}
          probe_body: ${{ inputs.probe_body }}
          dwell_seconds: ${{ inputs.dwell_seconds }}
          run_timeout: ${{ inputs.run_timeout }}
          allow_workload_failure: ${{ inputs.allow_workload_failure }}
          spec_file: ${{ inputs.spec_file }}
          mode: ${{ inputs.mode }}
          abi: ${{ inputs.abi }}
          flags: ${{ inputs.flags }}
          abstractions: ${{ inputs.abstractions }}
          exec_mode: ${{ inputs.exec_mode }}
          glob_threshold: ${{ inputs.glob_threshold }}
          generalize: ${{ inputs.generalize }}
          exclude: ${{ inputs.exclude }}
          rewrite: ${{ inputs.rewrite }}
          extra_rules: ${{ inputs.extra_rules }}
          settle_seconds: ${{ inputs.settle_seconds }}
          load_check: ${{ inputs.load_check }}

      - name: Diff against the committed profile
        id: diff
        env:
          PROFILE_PATH: ${{ steps.vars.outputs.profile_path }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- "$PROFILE_PATH")" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The committed profile is already up to date." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git --no-pager diff -- "$PROFILE_PATH" || true
          {
            echo "### Profile changed"
            echo
            echo '```diff'
            git --no-pager diff -- "$PROFILE_PATH" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail on drift
        if: inputs.fail_on_drift && steps.diff.outputs.changed == 'true'
        env:
          PROFILE_PATH: ${{ steps.vars.outputs.profile_path }}
        run: |
          echo "::error file=$PROFILE_PATH::The committed AppArmor profile is out of date."
          echo "Run the profile workflow without fail_on_drift to get a PR with the regenerated profile."
          exit 1

      - name: Upload the generated profile
        if: ${{ !inputs.dry_run && steps.diff.outputs.changed == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.vars.outputs.artifact }}
          path: ${{ steps.vars.outputs.profile_path }}
          if-no-files-found: error
          retention-days: 7

  propose:
    name: Open the pull request
    needs: generate
    if: ${{ !inputs.dry_run && needs.generate.outputs.changed == 'true' }}
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 15
    # Inherits the caller's permissions; needs contents:write + pull-requests:write.
    # This job never builds or runs the application, which is what keeps the
    # write-scoped token away from application code.
    outputs:
      pr_number: ${{ steps.pr.outputs.number }}
      pr_url: ${{ steps.pr.outputs.url }}

    steps:
      - name: Check out the base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.generate.outputs.base }}
          token: ${{ secrets.token || github.token }}
          persist-credentials: true

      - name: Download the generated profile
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.generate.outputs.artifact }}
          path: ${{ runner.temp }}/generated

      - name: Push the branch
        env:
          PROFILE_PATH: ${{ needs.generate.outputs.profile_path }}
          BRANCH: ${{ needs.generate.outputs.branch }}
          SUBJECT: ${{ needs.generate.outputs.subject }}
          GENERATOR: ${{ needs.generate.outputs.generator_used }}
          TARGET: ${{ inputs.target }}
          STAGED: ${{ runner.temp }}/generated
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # The artifact holds the profile under its own basename.
          mkdir -p "$(dirname "$PROFILE_PATH")"
          cp "$STAGED/$(basename "$PROFILE_PATH")" "$PROFILE_PATH"

          if [ -z "$(git status --porcelain -- "$PROFILE_PATH")" ]; then
            echo "::warning::The base branch already carries this profile; nothing to push."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add -- "$PROFILE_PATH"
          git commit -m "$SUBJECT" \
            -m "Generated by the $GENERATOR generator ($TARGET target) in $RUN_URL"
          # This branch belongs to the workflow, so replacing its single commit
          # keeps the PR readable instead of accumulating regeneration noise.
          git push --force origin "HEAD:refs/heads/$BRANCH"

      - name: Open or update the pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.token || github.token }}
          BRANCH: ${{ needs.generate.outputs.branch }}
          BASE: ${{ needs.generate.outputs.base }}
          TITLE: ${{ needs.generate.outputs.title }}
          PROFILE_PATH: ${{ needs.generate.outputs.profile_path }}
          GENERATOR: ${{ needs.generate.outputs.generator_used }}
          NAME: ${{ inputs.name }}
          TARGET: ${{ inputs.target }}
          MODE: ${{ inputs.mode }}
          EXTRA_BODY: ${{ inputs.pr_body }}
          LABELS: ${{ inputs.labels }}
          REVIEWERS: ${{ inputs.reviewers }}
          TEAM_REVIEWERS: ${{ inputs.team_reviewers }}
          DRAFT: ${{ inputs.draft }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          body_file="$RUNNER_TEMP/pr-body.md"
          {
            echo "Regenerated the AppArmor profile for \`$NAME\`."
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Profile | \`$PROFILE_PATH\` |"
            echo "| Target | \`$TARGET\` |"
            echo "| Mode | \`$MODE\` |"
            echo "| Generator | \`$GENERATOR\` |"
            echo "| Run | $RUN_URL |"
            echo
            echo "### Review checklist"
            echo
            echo "- [ ] No rule grants more than the workload needs, especially under \`/etc\`, \`/proc\` and \`/sys\`."
            echo "- [ ] No capability appears that the application should not hold."
            echo "- [ ] Network rules match the families and socket types the service actually uses."
            echo "- [ ] Executable transitions are intended: \`ix\` keeps the child here, \`Px\` requires its own profile, \`Ux\` drops confinement."
            echo "- [ ] Paths carrying a build id, hostname or timestamp are globbed, not pinned."
            echo
            if [ "$GENERATOR" = "runtime" ]; then
              echo "> This profile was learned from one CI run. Anything the workload did"
              echo "> not do during that run is absent here and will be denied once the"
              echo "> profile is enforced. Exercise the workload broadly, or widen the"
              echo "> rules by hand before merging."
            else
              echo "> This profile was rendered from the declarative spec. Change the spec"
              echo "> rather than this file; the next run overwrites it."
            fi
            if [ -n "$EXTRA_BODY" ]; then
              echo
              echo "$EXTRA_BODY"
            fi
          } > "$body_file"

          number="$(gh pr list --head "$BRANCH" --base "$BASE" --state open \
                      --json number --jq '.[0].number // empty')"

          if [ -z "$number" ]; then
            args=(--head "$BRANCH" --base "$BASE" --title "$TITLE" --body-file "$body_file")
            [ "$DRAFT" = "true" ] && args+=(--draft)
            url="$(gh pr create "${args[@]}")"
            number="$(gh pr view "$url" --json number --jq .number)"
            echo "Opened $url"
          else
            gh pr edit "$number" --title "$TITLE" --body-file "$body_file" >/dev/null
            url="$(gh pr view "$number" --json url --jq .url)"
            echo "Updated $url"
          fi

          if [ -n "$LABELS" ]; then
            gh pr edit "$number" --add-label "$LABELS" >/dev/null \
              || echo "::warning::Could not apply labels '$LABELS'. Do they exist in this repository?"
          fi

          if [ -n "$REVIEWERS" ] || [ -n "$TEAM_REVIEWERS" ]; then
            args=()
            [ -n "$REVIEWERS" ] && args+=(--add-reviewer "$REVIEWERS")
            [ -n "$TEAM_REVIEWERS" ] && args+=(--add-reviewer "$TEAM_REVIEWERS")
            gh pr edit "$number" "${args[@]}" >/dev/null \
              || echo "::warning::Could not request review. A PR cannot request review from its own author."
          fi

          {
            echo "number=$number"
            echo "url=$url"
          } >> "$GITHUB_OUTPUT"
          echo "Pull request: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Enable auto-merge
        if: ${{ inputs.auto_merge && !inputs.draft && steps.pr.outputs.number != '' }}
        env:
          GH_TOKEN: ${{ secrets.token || github.token }}
          NUMBER: ${{ steps.pr.outputs.number }}
          METHOD: ${{ inputs.merge_method }}
          REQUIRED: ${{ inputs.require_auto_merge }}
        run: |
          set -euo pipefail
          if gh pr merge "$NUMBER" --auto "--$METHOD"; then
            echo "Auto-merge is armed. GitHub will merge once reviews and checks pass."
            exit 0
          fi
          msg="Could not enable auto-merge on PR #$NUMBER. Check that the repository has 'Allow auto-merge' enabled, and that the base branch has a ruleset or protection rule requiring a review -- with nothing required there is nothing for auto-merge to wait on."
          if [ "$REQUIRED" = "true" ]; then
            echo "::error::$msg"
            exit 1
          fi
          echo "::warning::$msg"
